// CS2 Game State Integration config. Drop this file into:
//   Windows: Steam\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\
//   Linux:   ~/.steam/steam/steamapps/common/Counter-Strike Global Offensive/game/csgo/cfg/
//
// CS2 honours the same CS:GO GSI mechanism — restart the game after copying.
// The auth.token below MUST match `gsi.auth_token` in cfg/default.yaml.
"CS2 RL Bot v1"
{
    "uri" "http://127.0.0.1:3000/"
    "timeout" "1.1"
    "buffer"  "0.0"
    "throttle" "0.05"
    "heartbeat" "10.0"
    "auth"
    {
        "token" "CHANGE_ME_DEVIN"
    }
    "data"
    {
        "provider"            "1"
        "map"                 "1"
        "round"               "1"
        "player_id"           "1"
        "player_state"        "1"
        "player_weapons"      "1"
        "player_match_stats"  "1"
        "bomb"                "1"
        "phase_countdowns"    "1"
        "allgrenades"         "0"
        "allplayers_id"       "0"
        "allplayers_state"    "0"
        "allplayers_match_stats" "0"
        "allplayers_weapons"  "0"
        "allplayers_position" "0"
        "player_position"     "0"
    }
}
