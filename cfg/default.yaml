# Default configuration. Override via:
#   * a YAML file passed with --config / -c
#   * environment variables prefixed CS2BOT_ (e.g. CS2BOT_AGENT__ALGO=random)
gsi:
  host: 127.0.0.1
  port: 3000
  auth_token: CHANGE_ME_DEVIN
  request_timeout_s: 1.0

capture:
  monitor_index: 1
  target_fps: 30
  resize_to: [84, 84]
  grayscale: false
  # When true, every captured frame keeps a copy of the full-resolution RGB
  # alongside the 84x84 policy frame. Required for YOLO to detect anything
  # useful — 84x84 enemies are ~1 pixel wide.
  keep_full_frame: true

vision:
  enabled: false
  # Drop a CS2-finetuned YOLOv8 here. Suggested: Vombit's gated HF model
  #   https://huggingface.co/Vombit/yolov8n_cs2 (CC BY-NC-ND 4.0)
  # download yolov8n_cs2.pt and point this at it.
  model_path: models/yolov8n.pt
  confidence_threshold: 0.35
  iou_threshold: 0.45
  device: auto
  # Number of nearest-to-crosshair enemies exposed to the policy each step
  # (extra slots are zero-padded). Each slot is 8 floats: valid, dx, dy,
  # width, height, is_head, is_enemy, confidence.
  max_enemy_slots: 4

controller:
  backend: noop          # noop | pydirectinput | pynput
  mouse_sensitivity: 2.0
  max_mouse_delta: 200
  safety_kill_key: f9

agent:
  algo: ppo              # ppo | random | scripted
  policy: MultiInputPolicy
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  checkpoint_dir: checkpoints/
  tensorboard_log: tensorboard/

rewards:
  kill_bonus: 1.0
  death_penalty: -1.0
  damage_dealt_coef: 0.01
  damage_taken_coef: -0.01
  round_win_bonus: 2.0
  round_loss_penalty: -1.0
  bomb_plant_bonus: 0.5
  bomb_defuse_bonus: 0.5
  survival_per_step: 0.001
  kill_switch_penalty: -0.1

seed: 42
log_level: INFO
dry_run: true            # MUST be set to false (and acknowledged) before training
