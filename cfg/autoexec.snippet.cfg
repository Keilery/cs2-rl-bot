// Append (or merge) these lines to your CS2 autoexec.cfg if you want to disable
// raw input while experimenting with software-injected mouse events.
//
// WARNING: m_rawinput 0 is only required for the `pynput` controller backend on
// Linux/X11. The `pydirectinput` backend on Windows uses SendInput which the
// game accepts even with raw input enabled.
//
// DO NOT commit this file with `host_writeconfig` — let CS2 manage that.

// m_rawinput 0
// con_enable 1
// developer 1
