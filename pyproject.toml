[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-rl-bot"
version = "0.1.0"
description = "Reinforcement-learning agent scaffold for Counter-Strike 2 (offline / sv_cheats only)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Keilery" }]
keywords = ["cs2", "counter-strike", "reinforcement-learning", "ppo", "gymnasium"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core RL stack
    "gymnasium>=0.29,<2.0",
    "stable-baselines3>=2.3,<3.0",
    "numpy>=1.26,<3.0",
    "torch>=2.2,<3.0",

    # Observation
    "mss>=9.0,<11.0",            # screen capture
    "opencv-python-headless>=4.9,<5.0",
    "pillow>=10.0,<12.0",
    "fastapi>=0.110,<1.0",       # GSI HTTP listener
    "uvicorn>=0.29,<1.0",
    "pydantic>=2.6,<3.0",

    # Optional vision (loaded lazily so CI can install the core extras only)
    # "ultralytics>=8.1,<9.0",   # YOLOv8 — installed via `pip install -e .[vision]`

    # Utilities
    "pyyaml>=6.0,<7.0",
    "loguru>=0.7,<1.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
]

[project.optional-dependencies]
vision = [
    "ultralytics>=8.1,<9.0",
]
# Input control is platform-specific — pydirectinput only works on Windows;
# pynput / xdotool are used as fallbacks on Linux.
windows = [
    "pydirectinput>=1.0.4,<2.0",
    "pywin32>=306; platform_system=='Windows'",
]
linux = [
    "pynput>=1.7,<2.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    "types-pyyaml",
]

[project.scripts]
cs2-rl-bot = "cs2_rl_bot.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cs2_rl_bot" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function call in default argument (FastAPI/Typer pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
